name: Build release artifacts
on:
  workflow_dispatch:
    inputs:
      signed:
        description: '使用已配置的 Developer ID 证书签名并提交 Apple 公证'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-14
    env:
      ALLOW_HEAVY: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:desktop
      - name: Build macOS packages
        env:
          TESTO_SIGNED_RELEASE: ${{ inputs.signed && '1' || '0' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --config electron-builder.config.cjs --mac --arm64 --x64 --publish never
      - run: node scripts/package-connector.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Testo-macOS-${{ inputs.signed && 'signed' || 'local-test' }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
